<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="每天快速掌握值得关注的 AI 动态" />
    <title>每日 AI 情报站</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <main>
      <header class="hero">
        <p class="eyebrow">DAILY AI BRIEF</p>
        <h1>每日 AI 情报站</h1>
        <p>在几分钟内，了解近期值得关注的 AI 动态。</p>
        <p id="update-status" class="muted">正在读取最新情报…</p>
        <p class="muted">筛选按 Asia/Shanghai 计算；“最近 7 天”含今天。</p>
        <ul id="source-status" class="source-status" aria-live="polite"></ul>
      </header>

      <section class="controls" aria-label="筛选新闻">
        <label>关键词<input id="query" type="search" placeholder="搜索标题或摘要" /></label>
        <label>来源<select id="source"><option value="">全部来源</option></select></label>
        <fieldset>
          <legend>时间范围</legend>
          <button class="active" data-days="7">最近 7 天</button>
          <button data-days="0">今天</button>
          <button data-days="99999">全部</button>
        </fieldset>
        <button id="clear" class="secondary">清除条件</button>
      </section>

      <p id="count" class="count"></p>
      <section id="news" class="news" aria-live="polite"></section>
    </main>

    <script type="module" src="./app.js"></script>
  </body>
</html>
